<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumahku – Katalog Properti</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F6;--surface:#fff;--ink:#16282B;--mute:#566A6D;--line:#D5E0DE;--brand:#0E6A62;--on-brand:#fff;--price:#935500;--tint:#DCEBE8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B1D;--surface:#172629;--ink:#E8F0EF;--mute:#9DB1B3;--line:#2A3D40;--brand:#4DC2B5;--on-brand:#08201D;--price:#F0B24D;--tint:#1E3436;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1B1D;--surface:#172629;--ink:#E8F0EF;--mute:#9DB1B3;--line:#2A3D40;--brand:#4DC2B5;--on-brand:#08201D;--price:#F0B24D;--tint:#1E3436;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
.btn[aria-pressed="true"]{background:var(--tint);border-color:var(--brand)}
.hero{padding:28px 0 20px}
h1{font-size:clamp(30px,5.4vw,52px);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:0 0 20px;max-width:15em}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.filters label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.filters input,.filters select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.bar p{margin:0;color:var(--mute)}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.card .open{display:block;width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.card svg{display:block;width:100%;height:auto}
.card .body{padding:14px 16px 16px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--brand);margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:17px;line-height:1.3}
.price{font-weight:800;color:var(--price);font-size:18px;margin:2px 0 6px}
.meta{color:var(--mute);font-size:14px}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;width:min(640px,94vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,22,.6)}
dialog .in{padding:18px 22px 22px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0;padding:12px;background:var(--bg);border-radius:12px;text-align:center}
.specs b{display:block;font-size:18px}.specs span{font-size:12px;color:var(--mute)}
.agent{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
a.btn{text-decoration:none;display:inline-block}
[hidden]{display:none!important}
.af{display:grid;grid-template-columns:1fr 1fr;gap:10px}.af label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}.af input,.af select,.af textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.af .w{grid-column:1/-1}.al{list-style:none;margin:0;padding:0}.al li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}#st{color:var(--brand);font-weight:700}
@media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Rumahku</div>
    <div style="display:flex;gap:8px"><button class="btn primary" id="admBtn" hidden>Kelola listing</button><button class="btn" id="acct">Masuk</button><button class="btn" id="favBtn" aria-pressed="false">Favorit (0)</button></div>
  </header>
  <section class="hero">
    <h1>Temukan rumah, apartemen, atau tanah yang cocok untuk Anda</h1>
    <div class="filters" role="search">
      <div class="q"><label for="q">Lokasi atau nama properti</label><input id="q" type="search" placeholder="Contoh: Malang, Waru, cluster"></div>
      <div><label for="mode">Status</label><select id="mode"><option value="">Semua</option><option>Dijual</option><option>Disewa</option></select></div>
      <div><label for="type">Jenis</label><select id="type"><option value="">Semua</option><option>Rumah</option><option>Apartemen</option><option>Tanah</option><option>Ruko</option></select></div>
      <div><label for="bed">Kamar tidur</label><select id="bed"><option value="0">Semua</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></div>
      <div><label for="max">Harga maksimal</label><select id="max"><option value="0">Semua</option><option value="500000000">Rp 500 juta</option><option value="1000000000">Rp 1 miliar</option><option value="2000000000">Rp 2 miliar</option><option value="5000000000">Rp 5 miliar</option></select></div>
    </div>
  </section>
  <div class="bar">
    <p id="count" aria-live="polite"></p>
    <label>Urutkan <select id="sort"><option value="new">Terbaru</option><option value="lo">Harga terendah</option><option value="hi">Harga tertinggi</option></select></label>
  </div>
  <main class="grid" id="grid"></main>
</div>

<dialog id="dlg" aria-labelledby="dt"><div id="dbody"></div></dialog>
<dialog id="login" aria-label="Akun"><div class="in" id="lbody"></div></dialog>
<dialog id="adm" aria-label="Kelola listing"><div class="in" id="abody"></div></dialog>

<script>
const DEMO=[
{id:1,t:"Rumah 2 lantai dekat akses tol",type:"Rumah",mode:"Dijual",price:1850000000,city:"Sidoarjo",bed:4,bath:3,lt:120,lb:150,hue:170,agent:"Dewi Anggraini",wa:"6281200000001",desc:"Rumah dua lantai di cluster tertutup dengan carport dua mobil, dapur terpisah, dan taman belakang. Sertifikat SHM, siap huni."},
{id:2,t:"Apartemen studio tengah kota",type:"Apartemen",mode:"Disewa",price:4500000,city:"Surabaya",bed:1,bath:1,lt:0,lb:28,hue:205,agent:"Rudi Hartono",wa:"6281200000002",desc:"Unit studio furnished di lantai 15, lengkap dengan AC, water heater, dan akses kolam renang. Minimal sewa 6 bulan."},
{id:3,t:"Rumah minimalis dengan taman",type:"Rumah",mode:"Dijual",price:780000000,city:"Malang",bed:3,bath:2,lt:90,lb:72,hue:145,agent:"Sari Wulandari",wa:"6281200000003",desc:"Rumah satu lantai di kawasan tenang, dekat sekolah dan pasar. Listrik 2200 watt, air PDAM, SHM."},
{id:4,t:"Tanah kavling siap bangun",type:"Tanah",mode:"Dijual",price:420000000,city:"Batu",bed:0,bath:0,lt:200,lb:0,hue:95,agent:"Bambang Susilo",wa:"6281200000004",desc:"Kavling 200 m² dengan akses jalan 6 meter dan pemandangan pegunungan. Legalitas SHM, bebas banjir."},
{id:5,t:"Ruko 3 lantai di jalan utama",type:"Ruko",mode:"Dijual",price:3400000000,city:"Surabaya",bed:0,bath:3,lt:80,lb:240,hue:25,agent:"Rudi Hartono",wa:"6281200000002",desc:"Ruko strategis dengan frontage lebar, cocok untuk toko, kantor, atau klinik. Parkir depan untuk empat kendaraan."},
{id:6,t:"Rumah keluarga dekat kampus",type:"Rumah",mode:"Disewa",price:6000000,city:"Malang",bed:3,bath:2,lt:105,lb:90,hue:260,agent:"Sari Wulandari",wa:"6281200000003",desc:"Rumah siap huni, cocok untuk keluarga atau kos eksklusif. Sudah ada AC di semua kamar. Sewa tahunan."},
{id:7,t:"Apartemen 2 kamar dengan balkon",type:"Apartemen",mode:"Dijual",price:960000000,city:"Surabaya",bed:2,bath:2,lt:0,lb:54,hue:320,agent:"Dewi Anggraini",wa:"6281200000001",desc:"Unit lantai 22 menghadap kota, dekat pusat perbelanjaan. Fasilitas gym, kolam renang, dan keamanan 24 jam."},
{id:8,t:"Rumah baru di perumahan berkembang",type:"Rumah",mode:"Dijual",price:495000000,city:"Sidoarjo",bed:2,bath:1,lt:84,lb:45,hue:50,agent:"Bambang Susilo",wa:"6281200000004",desc:"Rumah subsidi-plus dengan desain modern, bisa KPR. Dekat gerbang tol dan kawasan industri."}
].map(l=>({...l,id:String(l.id)}));
let L=[],DB=null,ASSETS=null,canAdmin=false,me=null,sync=false,favDoc=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPES=["Rumah","Apartemen","Tanah","Ruko"],MODES=["Dijual","Disewa"];
function norm(d,id){const n=k=>Math.max(0,+d[k]||0);return{id:String(id),t:esc(d.t),type:TYPES.includes(d.type)?d.type:"Rumah",mode:MODES.includes(d.mode)?d.mode:"Dijual",price:n("price"),city:esc(d.city),bed:n("bed"),bath:n("bath"),lt:n("lt"),lb:n("lb"),hue:n("hue")%360,agent:esc(d.agent),wa:String(d.wa||"").replace(/\D/g,""),desc:esc(d.desc),photo:/^https:\/\/[^\s"'<>]+$/.test(d.photo||"")?esc(d.photo):"",ts:n("ts")}}
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]").map(String))}catch(e){}
let onlyFav=false;
const saveFavs=()=>{try{localStorage.setItem("favs",JSON.stringify([...favs]))}catch(e){}if(me&&DB)syncFavs()};
const num=n=>n.toFixed(2).replace(/\.?0+$/,"").replace(".",",");
function rp(l){const p=l.price;
  if(l.mode==="Disewa")return "Rp "+num(p/1e6)+" juta / bulan";
  return p>=1e9?"Rp "+num(p/1e9)+" miliar":"Rp "+num(p/1e6)+" juta"}
function art(l){if(l.photo)return `<img src="${l.photo}" alt="Foto ${l.t}" style="display:block;width:100%;aspect-ratio:320/190;object-fit:cover">`;const h=l.hue;let s=`<svg viewBox="0 0 320 190" role="img" aria-label="Ilustrasi ${l.type}"><rect width="320" height="190" fill="hsl(${h} 45% 88%)"/><rect y="150" width="320" height="40" fill="hsl(${h} 35% 62%)"/>`;
  const body=`hsl(${h} 30% 97%)`,roof=`hsl(${h} 50% 30%)`,win=`hsl(${h} 45% 70%)`;
  if(l.type==="Rumah")s+=`<rect x="90" y="85" width="140" height="68" fill="${body}"/><polygon points="78,88 160,36 242,88" fill="${roof}"/><rect x="148" y="112" width="24" height="41" fill="${roof}"/><rect x="104" y="100" width="30" height="24" fill="${win}"/><rect x="186" y="100" width="30" height="24" fill="${win}"/>`;
  else if(l.type==="Apartemen"){s+=`<rect x="105" y="24" width="110" height="129" fill="${body}"/><rect x="105" y="24" width="110" height="10" fill="${roof}"/>`;for(let r=0;r<5;r++)for(let c=0;c<4;c++)s+=`<rect x="${116+c*24}" y="${44+r*21}" width="14" height="12" fill="${win}"/>`}
  else if(l.type==="Ruko"){s+=`<rect x="70" y="50" width="180" height="103" fill="${body}"/><rect x="70" y="50" width="180" height="10" fill="${roof}"/><rect x="82" y="108" width="156" height="12" fill="${roof}"/>`;for(let c=0;c<5;c++)s+=`<rect x="${86+c*30}" y="72" width="20" height="26" fill="${win}"/><rect x="${86+c*30}" y="124" width="20" height="29" fill="${win}"/>`}
  else s+=`<rect x="60" y="150" width="200" height="4" fill="${roof}"/><rect x="156" y="96" width="5" height="58" fill="${roof}"/><rect x="128" y="78" width="62" height="30" rx="3" fill="${body}"/><rect x="138" y="88" width="42" height="4" fill="${win}"/><rect x="138" y="96" width="30" height="4" fill="${win}"/>`;
  return s+"</svg>"}
function specs(l){return l.type==="Tanah"?`${l.lt} m² tanah`:`${l.bed?l.bed+" KT · ":""}${l.lb} m² bangunan`}
function view(){
  const q=$("q").value.trim().toLowerCase(),mode=$("mode").value,type=$("type").value,bed=+$("bed").value,max=+$("max").value,sort=$("sort").value;
  let r=L.filter(l=>(!q||(l.t+" "+l.city+" "+l.type).toLowerCase().includes(q))&&(!mode||l.mode===mode)&&(!type||l.type===type)&&l.bed>=bed&&(!max||l.price<=max)&&(!onlyFav||favs.has(l.id)));
  if(sort==="lo")r.sort((a,b)=>a.price-b.price);else if(sort==="hi")r.sort((a,b)=>b.price-a.price);else r.sort((a,b)=>(b.ts||+b.id||0)-(a.ts||+a.id||0));
  $("count").textContent=r.length+" properti ditemukan";
  $("favBtn").textContent="Favorit ("+favs.size+")";
  $("grid").innerHTML=r.length?r.map(l=>`<article class="card"><button class="open" data-id="${l.id}" aria-label="Lihat detail ${l.t}">${art(l)}<div class="body"><span class="badge">${l.mode} · ${l.type}</span><h3>${l.t}</h3><div class="price">${rp(l)}</div><div class="meta">${l.city} · ${specs(l)}</div></div></button><button class="fav" data-fav="${l.id}" aria-pressed="${favs.has(l.id)}" aria-label="Simpan ke favorit">${favs.has(l.id)?"♥":"♡"}</button></article>`).join(""):`<div class="empty"><p><b>Tidak ada properti yang cocok.</b><br>Longgarkan filter atau hapus kata kunci pencarian.</p><button class="btn primary" id="reset">Atur ulang filter</button></div>`}
function detail(id){const l=L.find(x=>x.id===id);
  const msg=encodeURIComponent("Halo "+l.agent+", saya tertarik dengan "+l.t+" di "+l.city+". Apakah masih tersedia?");
  $("dbody").innerHTML=`${art(l)}<div class="in"><span class="badge">${l.mode} · ${l.type}</span><h2 id="dt" style="margin:0 0 4px">${l.t}</h2><div class="price">${rp(l)}</div><div class="meta">${l.city}</div>
  <div class="specs"><div><b>${l.bed||"–"}</b><span>Kamar tidur</span></div><div><b>${l.bath||"–"}</b><span>Kamar mandi</span></div><div><b>${l.lt||"–"}</b><span>Tanah (m²)</span></div><div><b>${l.lb||"–"}</b><span>Bangunan (m²)</span></div></div>
  <p>${l.desc}</p><div class="agent"><div><b>${l.agent}</b><br><span class="meta">Agen properti</span></div><span><a class="btn primary" href="https://wa.me/${l.wa}?text=${msg}" target="_blank" rel="noopener">Hubungi lewat WhatsApp</a> <button class="btn" id="close">Tutup</button></span></div></div>`;
  $("dlg").showModal()}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-id]"),f=e.target.closest("[data-fav]");
  if(f){const id=f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();view()}
  else if(o)detail(o.dataset.id);
  else if(e.target.id==="close")$("dlg").close();
  else if(e.target.id==="reset"){["q"].forEach(i=>$(i).value="");["mode","type"].forEach(i=>$(i).value="");$("bed").value="0";$("max").value="0";onlyFav=false;$("favBtn").setAttribute("aria-pressed","false");view()}
  else if(e.target.closest("[data-edit]"))admOpen(e.target.closest("[data-edit]").dataset.edit);
  else if(e.target.closest("[data-del]"))admDel(e.target.closest("[data-del]"));
  else if(e.target.id==="anew")admOpen(null);
  else if(e.target.id==="aclose"||e.target===$("adm"))$("adm").close();
  else if(e.target===$("dlg"))$("dlg").close()});
$("favBtn").addEventListener("click",()=>{onlyFav=!onlyFav;$("favBtn").setAttribute("aria-pressed",onlyFav);view()});
["q","mode","type","bed","max","sort"].forEach(i=>$(i).addEventListener("input",view));
let editing=null,photo="";
const msg=t=>{const s=$("st");if(s)s.textContent=t};
function admList(){return L.map(l=>`<li><span><b>${l.t}</b><br><span class="meta">${l.mode} · ${l.city} · ${rp(l)}</span></span><span><button class="btn" data-edit="${l.id}">Ubah</button> <button class="btn" data-del="${l.id}">Hapus</button></span></li>`).join("")||"<li>Belum ada listing. Isi formulir di atas untuk menambahkan.</li>"}
function admOpen(id){
  const l=(id&&L.find(x=>x.id===id))||{};editing=l.id||null;photo=(l.photo||"").replace(/&amp;/g,"&");
  const v=k=>l[k]??"";
  const opt=(a,c)=>a.map(x=>`<option${x===c?" selected":""}>${x}</option>`).join("");
  const fi=(k,lb,t="text",ph="")=>`<div><label for="f_${k}">${lb}</label><input id="f_${k}" name="${k}" type="${t}" ${t==="number"?'min="0"':""} placeholder="${ph}" value="${v(k)}"></div>`;
  $("abody").innerHTML=`<h2 style="margin:0 0 12px">${editing?"Ubah listing":"Tambah listing"}</h2><form id="af" class="af">
  <div class="w"><label for="f_t">Judul</label><input id="f_t" name="t" maxlength="90" value="${v("t")}"></div>
  <div><label for="f_ty">Jenis</label><select id="f_ty" name="type">${opt(TYPES,l.type)}</select></div>
  <div><label for="f_m">Status</label><select id="f_m" name="mode">${opt(MODES,l.mode)}</select></div>
  ${fi("price","Harga dalam rupiah (sewa: per bulan)","number")}${fi("city","Kota")}
  ${fi("bed","Kamar tidur","number")}${fi("bath","Kamar mandi","number")}${fi("lt","Luas tanah (m²)","number")}${fi("lb","Luas bangunan (m²)","number")}
  ${fi("agent","Nama agen")}${fi("wa","Nomor WhatsApp agen","tel","628123456789")}
  <div class="w"><label for="f_d">Deskripsi</label><textarea id="f_d" name="desc" rows="3">${v("desc")}</textarea></div>
  ${ASSETS?`<div class="w"><label for="ph">Foto (opsional)</label><input id="ph" type="file" accept="image/*"></div>`:""}
  <div class="w"><button class="btn primary" type="submit">Simpan</button> <button class="btn" type="button" id="anew">Kosongkan formulir</button> <button class="btn" type="button" id="aclose">Tutup</button> <span id="st" role="status"></span></div></form>
  <h3 style="margin:20px 0 4px">Daftar listing</h3><ul class="al">${admList()}</ul>`;
  if(!$("adm").open)$("adm").showModal()}
const CFG={url:"https://wxneesuhubtuldimyrgu.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4bmVlc3VodWJ0dWxkaW15cmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MjYxMzUsImV4cCI6MjEwODIwMjEzNX0.s5HJQEU0VHM6h4GqbHtCwaqxgE7elyvWIdpNA739IRw"};
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const rowToL=r=>norm({t:r.t,type:r.type,mode:r.mode,price:r.price,city:r.city,bed:r.bed,bath:r.bath,lt:r.lt,lb:r.lb,hue:r.hue,agent:r.agent,wa:r.wa,desc:r.descr,photo:r.photo_url,ts:Date.parse(r.created_at)||0},r.id);
async function load(){
  const {data,error}=await DB.from("listings").select("*").order("created_at",{ascending:false});
  if(error){$("count").textContent="Gagal memuat listing.";return}
  L=data.map(rowToL);view();const ul=document.querySelector(".al");if(ul)ul.innerHTML=admList()}
let syncing=Promise.resolve();
function syncFavs(){const ids=[...favs].filter(i=>UUID.test(i));
  syncing=syncing.then(async()=>{await DB.from("favorites").delete().eq("user_id",me.id);
    if(ids.length)await DB.from("favorites").insert(ids.map(i=>({user_id:me.id,listing_id:i})))}).catch(()=>{})}
async function admDel(b){if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Yakin hapus?";return}
  const {error}=await DB.from("listings").delete().eq("id",b.dataset.del);
  if(error)msg("Gagal menghapus: "+error.message);else await load()}
document.addEventListener("submit",async e=>{
  if(e.target.id==="af"){e.preventDefault();
    const f=new FormData(e.target),d={},cur=L.find(x=>x.id===editing)||{};
    ["t","city","agent","wa","desc","type","mode"].forEach(k=>d[k]=String(f.get(k)||"").trim());
    ["price","bed","bath","lt","lb"].forEach(k=>d[k]=Math.max(0,Math.round(+f.get(k)||0)));
    if(!d.t||!d.city||!d.price){msg("Judul, kota, dan harga wajib diisi.");return}
    const row={t:d.t,type:d.type,mode:d.mode,price:d.price,city:d.city,bed:d.bed,bath:d.bath,lt:d.lt,lb:d.lb,agent:d.agent,wa:d.wa,descr:d.desc,photo_url:photo||null,hue:cur.hue??Math.floor(Math.random()*360)};
    const {error}=await (editing?DB.from("listings").update(row).eq("id",editing):DB.from("listings").insert(row));
    if(error){msg("Gagal menyimpan: "+error.message);return}
    await load();admOpen(null);msg("Tersimpan.")}
  else if(e.target.id==="authf"){e.preventDefault();
    const {error}=await DB.auth.signInWithPassword({email:$("ae").value.trim(),password:$("ap").value});
    $("lm").textContent=error?"Gagal masuk: "+error.message:"";if(!error)$("login").close()}});
document.addEventListener("change",async e=>{
  if(e.target.id!=="ph"||!e.target.files[0])return;const f=e.target.files[0];msg("Mengunggah foto...");
  const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=crypto.randomUUID()+"."+ext;
  const {error}=await DB.storage.from("listing-photos").upload(path,f,{contentType:f.type});
  if(error){msg("Foto gagal diunggah: "+error.message);return}
  photo=DB.storage.from("listing-photos").getPublicUrl(path).data.publicUrl;msg("Foto terunggah. Klik Simpan.")});
$("admBtn").addEventListener("click",()=>admOpen(null));
const setAcct=()=>{$("acct").textContent=me?"Akun saya":"Masuk"};
function openLogin(){
  const box=$("lbody");
  if(!DB)box.innerHTML=`<h2 style="margin:0 0 10px">Masuk</h2><p>Login belum aktif. Isi alamat dan kunci Supabase di bagian CFG pada file ini (lihat PANDUAN.md).</p><button class="btn" id="lx">Tutup</button>`;
  else if(me)box.innerHTML=`<h2 style="margin:0 0 10px">Akun Anda</h2><p>Masuk sebagai <b>${esc(me.email)}</b>. Peran: ${canAdmin?"Admin, bisa mengelola listing":"Pengunjung"}.</p><p>Favorit Anda tersimpan di akun ini dan ikut ke perangkat lain.</p><button class="btn primary" id="lout">Keluar</button> <button class="btn" id="lx">Tutup</button>`;
  else box.innerHTML=`<h2 style="margin:0 0 10px">Masuk atau daftar</h2><form id="authf" class="af"><div class="w"><label for="ae">Email</label><input id="ae" type="email" required autocomplete="email"></div><div class="w"><label for="ap">Kata sandi (minimal 6 karakter)</label><input id="ap" type="password" minlength="6" required autocomplete="current-password"></div><div class="w"><button class="btn primary" type="submit">Masuk</button> <button class="btn" type="button" id="lsu">Daftar akun baru</button> <button class="btn" type="button" id="lx">Tutup</button></div><p class="w meta" id="lm" role="status"></p></form>`;
  $("lx").addEventListener("click",()=>$("login").close());
  const o=$("lout");if(o)o.addEventListener("click",async()=>{await DB.auth.signOut();$("login").close()});
  const u=$("lsu");if(u)u.addEventListener("click",async()=>{
    const em=$("ae").value.trim(),pw=$("ap").value;if(!em||pw.length<6){$("lm").textContent="Isi email dan kata sandi minimal 6 karakter.";return}
    const {data,error}=await DB.auth.signUp({email:em,password:pw});
    $("lm").textContent=error?"Gagal daftar: "+error.message:(data.session?"Pendaftaran berhasil.":"Pendaftaran berhasil. Cek email Anda untuk konfirmasi, lalu masuk.")});
  $("login").showModal()}
$("acct").addEventListener("click",openLogin);
$("login").addEventListener("click",e=>{if(e.target===$("login"))$("login").close()});
async function role(){
  canAdmin=false;
  if(me){const {data}=await DB.from("admins").select("user_id").eq("user_id",me.id);canAdmin=!!(data&&data.length)}
  ASSETS=canAdmin;$("admBtn").hidden=!canAdmin;setAcct();
  if(me){const {data}=await DB.from("favorites").select("listing_id");
    if(data){favs=new Set([...favs,...data.map(r=>r.listing_id)]);view();syncFavs()}}}
(async()=>{
  $("count").textContent="Memuat listing...";
  const ok=window.supabase&&/^https:\/\//.test(CFG.url)&&!CFG.key.startsWith("ISI_");
  if(!ok){L=DEMO;view();return}
  DB=supabase.createClient(CFG.url,CFG.key);
  await load();
  DB.auth.onAuthStateChange((_ev,ses)=>{me=ses?ses.user:null;setTimeout(role,0)});
})();
</script>
</body>
</html>
